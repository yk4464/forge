# forge 配置示例 — 复制为 config.toml 并填入你的厂商信息
# 放在项目根目录或 ~/.forge/config.toml

[provider]
# 协议面，三选一：
#   "openai"    — POST /v1/chat/completions（OpenAI 兼容，覆盖 DeepSeek/智谱/通义等）
#   "responses" — POST /v1/responses（OpenAI Responses API）
#   "anthropic" — POST /v1/messages（Anthropic Messages API）
protocol = "openai"
# base_url（带不带 /v1 都可以）
base_url = "https://api.deepseek.com"
# 从哪个环境变量读 API key；也可直接用 api_key = "sk-..." 内联（优先级更高）
api_key_env = "DEEPSEEK_API_KEY"

[model]
name = "deepseek-flash"
# 可选：temperature = 0.7
max_tokens = 8192

[context]
# 模型上下文窗口（token 数）
context_window = 131072
# 可选：显式自动压缩阈值（会被钳制到有效窗口的 90% 以内）
# auto_compact_token_limit = 100000
# shell 工具输出进入历史的字节上限（默认 1MiB）
tool_output_max_bytes = 1048576
# 可选：显式指定 bash.exe 路径（默认自动探测）
# shell_path = "C:\\Program Files\\Git\\bin\\bash.exe"
# shell 工具默认超时秒数（最大 600）
shell_timeout_secs = 120

[budget]
# 单轮预算：达到上限时本轮停止并给出说明，发新消息即可继续。0 = 不限制。
# 单轮最多执行的工具调用次数
max_tool_calls = 60
# 单轮最长墙钟时间（秒）
max_turn_seconds = 900
# 单轮累计 token 上限（输入+输出）
# max_turn_tokens = 0
# 连续 N 次完全相同的工具调用（同工具同参数）或相同工具错误后停止本轮，
# 防止失控循环；调大可容忍更长的正常轮询
loop_threshold = 5

[permissions]
# 权限规则（S2）：allow = 直接放行；ask = 每次询问（TUI 内可选"本会话总是允许"）；
# deny = 拒绝。未列出的工具：shell 默认 ask，其它默认 deny；
# 无头模式（forge check）遇到 ask 一律明确拒绝——不默认放行。
# default = "allow"
[permissions.tools]
# shell = "allow"
