[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-provider",
    "crates/forge-tools",
    "crates/forge-storage",
    "crates/forge-tui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["yk4464"]
description = "forge — a streaming-first coding agent in Rust (TUI, MCP-ready core)"
repository = "https://github.com/yk4464/forge"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
ratatui = "0.29"
crossterm = "0.28"

forge-core = { path = "crates/forge-core" }
forge-provider = { path = "crates/forge-provider" }
forge-tools = { path = "crates/forge-tools" }
forge-storage = { path = "crates/forge-storage" }

[profile.release]
lto = "thin"
strip = "symbols"
